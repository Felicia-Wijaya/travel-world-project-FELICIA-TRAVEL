<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Paket</title>

<link rel="stylesheet" href="css/style.css">

<style>
.detail{
    max-width:900px;
    margin:50px auto;
    background:#fff;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
    overflow:hidden;
}

.detail img{
    width:100%;
    height:400px;
    object-fit:cover;
}

.content{
    padding:30px;
}

.content h1{
    margin-bottom:15px;
}

.price{
    font-size:28px;
    color:#0a2b5e;
    font-weight:bold;
    margin:20px 0;
}

.btn-book{
    display:inline-block;
    padding:15px 30px;
    background:#0a2b5e;
    color:white;
    text-decoration:none;
    border-radius:8px;
}
</style>

</head>
<body>

<div class="detail">

<img id="gambar">

<div class="content">

<h1 id="nama"></h1>

<p id="durasi"></p>

<div class="price" id="harga"></div>

<p id="deskripsi"></p>

<a href="package.html" class="btn-book">
Kembali ke Paket
</a>

</div>

</div>

<script>

const paket=new URLSearchParams(window.location.search).get("paket");

const data={

tokyo:{
nama:"Tokyo Sakura Tour",
gambar:"https://images.unsplash.com/photo-1540959733332-eab4deabeeaf",
durasi:"6 Hari 5 Malam",
harga:"Rp16.990.000",
deskripsi:"Nikmati keindahan bunga sakura, Gunung Fuji, Shibuya, Asakusa, dan Disneyland Tokyo."
},

seoul:{
nama:"Seoul Autumn",
gambar:"https://ik.imagekit.io/tvlk/blog/2022/12/south-korea_autumn_shutterstock_1149210557-Copy.jpg?tr=q-70,c-at_max,w-500,h-250,dpr-2",
durasi:"5 Hari 4 Malam",
harga:"Rp11.990.000",
deskripsi:"Menjelajahi Gyeongbokgung Palace, Namsan Tower, Myeongdong dan menikmati musim gugur Korea."
},

europe:{
nama:"Europe Classic",
gambar:"https://images.unsplash.com/photo-1499856871958-5b9627545d1a",
durasi:"9 Hari 7 Malam",
harga:"Rp27.990.000",
deskripsi:"Mengunjungi Paris, Swiss, Amsterdam dan berbagai kota indah di Eropa."
},

australia:{
nama:"Australia Explore",
gambar:"https://images.unsplash.com/photo-1523482580672-f109ba8cb9be",
durasi:"7 Hari 6 Malam",
harga:"Rp22.990.000",
deskripsi:"Liburan ke Sydney Opera House, Blue Mountains dan berbagai destinasi populer Australia."
},

bali:{
    nama:"Bali Paradise",
    gambar:"https://images.unsplash.com/photo-1537953773345-d172ccf13cf1",
    durasi:"4 Hari 3 Malam",
    harga:"Rp6.990.000",
    deskripsi:"Menjelajahi Pantai Kuta, Tanah Lot, Ubud, dan Nusa Penida."
},

singapore:{
    nama:"Singapore City Escape",
    gambar:"https://images.unsplash.com/photo-1525625293386-3f8f99389edd",
    durasi:"3 Hari 2 Malam",
    harga:"Rp8.490.000",
    deskripsi:"Mengunjungi Marina Bay Sands, Merlion Park, Universal Studios, dan Gardens by the Bay."
},

dubai:{
    nama:"Dubai Luxury",
    gambar:"https://images.unsplash.com/photo-1512453979798-5ea266f8880c",
    durasi:"5 Hari 4 Malam",
    harga:"Rp18.990.000",
    deskripsi:"Nikmati Burj Khalifa, Palm Jumeirah, Dubai Mall, dan safari gurun."
},

newzealand:{
    nama:"New Zealand Adventure",
    gambar:"https://images.unsplash.com/photo-1469521669194-babb45599def",
    durasi:"8 Hari 7 Malam",
    harga:"Rp24.990.000",
    deskripsi:"Jelajahi Queenstown, Milford Sound, Rotorua, dan Danau Tekapo."
},

};


const item = data[paket];

if(item){

    document.getElementById("gambar").src = item.gambar;
    document.getElementById("nama").innerHTML = item.nama;
    document.getElementById("durasi").innerHTML = item.durasi;
    document.getElementById("harga").innerHTML = item.harga;
    document.getElementById("deskripsi").innerHTML = item.deskripsi;

}else{

    document.body.innerHTML =
    "<h2>Paket tidak ditemukan.</h2>";

}
</script>

</body>
</html>
