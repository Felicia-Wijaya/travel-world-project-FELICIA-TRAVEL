<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Travel Indonesia</title>

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- HEADER -->
    <header class="page-header fade-in">
        <h1>
            Explore <span class="highlight">Indonesia Bersama Felicia</span>
        </h1>

        <p>
            Temukan destinasi wisata terbaik dengan harga terjangkau
        </p>
    </header>

    <!-- NAVBAR -->
    <nav class="nav">
        <a href="index.html">Home</a>
        <a href="package.html">Package</a>
        <a href="booking.html">Booking</a>
        <a href="login.html">Login</a>
    </nav>


    <!-- LOGIN CONTAINER -->
    <div class="login-container">

        <!-- LOGIN BOX -->
        <div class="login-box fade-in">

            <!-- ICON -->
            <div class="login-icon">
                ✈
            </div>

            <!-- TITLE -->
            <h2>Welcome Back</h2>

            <!-- FORM -->
            <form action="dashboard.html">

                <!-- EMAIL -->
                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Masukkan email"
                        required
                    >

                </div>

                <!-- PASSWORD -->
                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        required
                    >

                </div>

                <!-- REMEMBER -->
                <div class="remember-box">

                    <label>
                        <input type="checkbox">
                        Remember Me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>

                <!-- BUTTON -->
                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>

            <!-- REGISTER -->
            <p class="register-text">

                Belum punya akun?

                <a href="#">
                    Register
                </a>

            </p>

        </div>

    </div>

</body>
</html>
